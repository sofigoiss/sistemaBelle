<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Belle - Divulgação Local</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar / Cabeçalho Superior -->
    <header class="navbar">
        <div class="container nav-content">
            <div class="brand">
                <h1>Sistema Belle 🌸</h1>
                <p>Rede de Apoio Local</p>
            </div>
            
            <div id="user-area" class="user-area">
                <!-- Preenchido via JS -->
            </div>
        </div>
    </header>

    <main class="container main-content">
        <!-- Barra de Ações e Pesquisa do Feed -->
        <section class="feed-control-bar">
            <div class="feed-title-area">
                <h2>Feed de Produtos & Artesanato</h2>
                <p>Descobre criações exclusivas perto de ti</p>
            </div>

            <div class="feed-actions">
                <!-- Botão para abrir o modal de nova publicação (visível apenas para trabalhadores) -->
                <button id="btn-abrir-modal" class="btn-primary hidden" onclick="abrirModalPost()">+ Nova Publicação</button>
                
                <div class="search-box">
                    <input type="text" id="input-pesquisa" placeholder="Pesquisar publicações...">
                </div>
            </div>
        </section>

        <!-- Feed de Publicações -->
        <section class="feed-section">
            <div id="feed-container" class="feed-grid">
                <!-- Carregado via JS -->
            </div>
        </section>
    </main>

    <!-- Modal para Criar/Editar Publicação -->
    <div id="modal-post" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="form-title">Nova Publicação</h3>
                <button class="btn-close" onclick="fecharModalPost()">&times;</button>
            </div>
            
            <form id="form-publicacao">
                <input type="hidden" id="post-id">
                
                <div class="input-group">
                    <label for="titulo">Título do Produto/Serviço</label>
                    <input type="text" id="titulo" placeholder="Ex: Bolo Caseiro de Chocolate" required>
                </div>

                <div class="input-group">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" step="0.01" id="preco" placeholder="35.00" required>
                </div>

                <div class="input-group">
                    <label for="imagem_url">URL da Imagem</label>
                    <input type="url" id="imagem_url" placeholder="https://exemplo.com/imagem.jpg">
                </div>

                <div class="input-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" rows="3" placeholder="Descreva o seu produto com carinho..."></textarea>
                </div>

                <div class="modal-buttons">
                    <button type="submit" id="btn-submit" class="btn-primary">Publicar no Feed</button>
                    <button type="button" class="btn-secondary" onclick="fecharModalPost()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
